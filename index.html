<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Black Market</title>
  <meta name="description" content="Black Market - Acesse no navegador ou baixe nosso aplicativo oficial para Android." />
  <meta name="theme-color" content="#090d16" />

  <!-- Open Graph -->
  <meta property="og:title" content="Black Market" />
  <meta property="og:description" content="Acesse nosso catálogo e realize suas compras pelo app ou no navegador." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mercadinho-guilla.web.app/" />

  <!-- Preconnect para acelerar o redirecionamento -->
  <link rel="preconnect" href="https://mercadinho-guilla.web.app" />

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 28, 45, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo com efeito de luz ambiente sutil */
    body::before {
      content: "";
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(9, 13, 22, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      color: #38bdf8;
    }

    .logo-badge svg {
      width: 44px;
      height: 44px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:hover,
    .btn-primary:active {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -4px rgba(16, 185, 129, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover,
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* Estado de carregamento / Redirecionamento automático */
    .redirecting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Dica especial para iOS PWA */
    .ios-tip {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .ios-tip strong {
      color: #e2e8f0;
    }

    footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card" id="mainCard">
      <!-- Ícone Black Market -->
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>

      <h1 id="title">Black Market</h1>
      <p class="subtitle" id="subtitle">Carregando...</p>

      <div id="contentArea">
        <div class="redirecting">
          <div class="spinner"></div>
          <span style="font-size: 0.88rem; color: var(--text-muted);">Iniciando aplicação...</span>
        </div>
      </div>

      <!-- Dica de PWA para iPhone -->
      <div class="ios-tip" id="iosTip" style="display: none;">
        💡 <strong>Dica no iPhone:</strong> Você pode usar como app! No Safari, toque no botão <strong>Compartilhar</strong> (ícone <span style="font-size: 1.1em;">⎙</span>) e depois em <strong>"Adicionar à Tela de Início"</strong>.
      </div>
    </div>

    <footer>
      Black Market &bull; Todos os direitos reservados
    </footer>
  </div>

  <script>
    (function () {
      const WEB_APP_URL = "https://mercadinho-guilla.web.app";
      const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.guilla.mercadinho";

      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const contentEl = document.getElementById('contentArea');
      const iosTipEl = document.getElementById('iosTip');

      // Preserva eventuais caminhos ou parâmetros que chegaram nesta URL
      const targetWebUrl = WEB_APP_URL + (window.location.search || '') + (window.location.hash || '');

      // Detecção de plataforma
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // Parâmetro opcional para forçar visualização de testes (?debug=true ou ?menu=true)
      const urlParams = new URLSearchParams(window.location.search);
      const forceMenu = urlParams.get('menu') === 'true';

      function renderAndroidChoice() {
        titleEl.textContent = "Black Market";
        subtitleEl.textContent = "Como você prefere acessar hoje?";

        contentEl.innerHTML = `
          <div class="actions">
            <a href="${PLAY_STORE_URL}" target="_blank" class="btn btn-primary" id="btnPlayStore">
              <!-- Ícone Google Play -->
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3.609 1.814L13.793 12 3.61 22.186c-.365-.365-.61-.914-.61-1.57V3.384c0-.656.245-1.205.61-1.57zm11.24 9.13L5.753 2.052l10.378 5.992-1.282 2.899zm0 2.112l1.282 2.9-10.378 5.992 9.096-8.892zm1.488-.73l4.316 2.493c.895.516.895 1.365 0 1.882l-4.316 2.493-1.63-3.684 1.63-3.184z"/>
              </svg>
              <span>Baixar no Google Play</span>
            </a>

            <a href="${targetWebUrl}" class="btn btn-secondary" id="btnWeb">
              <!-- Ícone Globo / Web -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span>Acessar versão Web</span>
            </a>
          </div>
        `;
      }

      function renderRedirecting(destinationName, destinationUrl, showIosTip) {
        titleEl.textContent = "Black Market";
        subtitleEl.textContent = "Redirecionando para a versão Web...";

        contentEl.innerHTML = `
          <div class="redirecting">
            <div class="spinner"></div>
            <a href="${destinationUrl}" class="btn btn-secondary" style="margin-top: 10px;">
              Clique aqui se não abrir automaticamente
            </a>
          </div>
        `;

        if (showIosTip) {
          iosTipEl.style.display = "block";
        }

        // Executa o redirecionamento imediato
        setTimeout(() => {
          window.location.replace(destinationUrl);
        }, 400);
      }

      // Decisão de rota:
      if (isAndroid || forceMenu) {
        // No Android: oferece o app nativo da Play Store ou a versão Web
        renderAndroidChoice();
      } else if (isIOS) {
        // No iOS: como a App Store está indisponível, vai direto para o Web App (salvação!)
        renderRedirecting("Web App", targetWebUrl, true);
      } else {
        // No Desktop / PC: vai direto para o Web App
        renderRedirecting("Web App", targetWebUrl, false);
      }
    })();
  </script>
</body>

</html>
